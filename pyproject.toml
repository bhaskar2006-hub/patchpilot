[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot"
version = "0.1.0"
description = "Autonomous self-healing CI/CD & test repair engine powered by local open-weight SLMs and Agent Skill Open Standard."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "PatchPilot Contributors" }]
requires-python = ">=3.9"
keywords = ["ai-agents", "open-source-ai", "self-healing-ci", "agent-skill", "ollama", "llm", "slm", "pytest", "test-healer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
patchpilot = "patchpilot.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["patchpilot*"]
